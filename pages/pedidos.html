<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fazer Pedido - Ultragaz</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Fazer Pedido</h1>
    </header>

    <nav>
        <a href="../index.html">Início</a>
        <a href="contato.html">Contato</a>
        <a href="pedidos.html">Fazer Pedido</a>
        <a href="pedidos.php">Ver Pedidos</a>
    </nav>

    <div class="container">
        <h2>Formulário de Pedido</h2>
        <form action="../pages php/salvar.php" method="POST">
            <label for="nome_cliente">Seu Nome:</label>
            <input type="text" id="nome_cliente" name="nome_cliente" required>

            <label for="email">Seu E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="produto">Produto:</label>
            <input type="text" id="produto" name="produto" placeholder="Ex: Botijão P13" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" value="1" min="1" required>

            <button type="submit">Confirmar Pedido</button>
        </form>
    </div>

    <footer>
        <p>&copy; Ultragaz - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
