
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato e Pedidos - Ultragaz</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <span>Ultragaz</span>
        </div>
        <nav class="navegacao">
            <a href="../index.html" class="link-nav">Início</a>
            <a href="contato.html" class="link-nav ativo">Peça Seu Gás / Contato</a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="secao-formulario">
            <h2>Peça seu Gás Azul ou Tire Dúvidas</h2>
            <p>Preencha os dados abaixo para solicitar seu atendimento rápido:</p>

            <form id="form-contato" class="formulario">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" placeholder="(19) 99999-9999">
                </div>

                <div class="campo">
                    <label for="produto">Selecione o Produto:</label>
                    <select id="produto">
                        <option value="">-- Selecione uma opção --</option>
                        <option value="p13">Botijão P13 (Residencial)</option>
                        <option value="p20">Botijão P20 (Empilhadeira)</option>
                        <option value="p45">Cilindro P45 (Comercial)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" maxlength="9"
                           inputmode="numeric" placeholder="00000-000">
                    <div id="cep-status" class="cep-status"
                         aria-live="polite"></div>
                </div>

                <div class="campo">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro">
                </div>

                <div class="linha-campos">
                    <div class="campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade">
                    </div>
                    <div class="campo campo-uf">
                        <label for="uf">UF:</label>
                        <input type="text" id="uf" maxlength="2">
                    </div>
                </div>

                <div class="campo">
                    <label for="mensagem">Número, Complemento e Observações:</label>
                    <textarea id="mensagem" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Pedido</button>
                <div id="mensagem-status" class="mensagem-status oculto"></div>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Ultragaz - O Gás Azul &copy; 2026</p>
        <p>Projeto acadêmico - DWS Colégio UNASP-HT</p>
    </footer>
</body>
</html>
