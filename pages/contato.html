<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato e Pedidos - Ultragaz</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <span>Ultragaz</span>
        </div>
        <nav class="navegacao">
            <a href="../index.html" class="link-nav">Início</a>
            <a href="contato.html" class="link-nav ativo">Peça Seu Gás / Contato</a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="secao-formulario">
            <h2>Peça seu Gás Azul ou Tire Dúvidas</h2>
            <p>Preencha os dados abaixo para solicitar seu atendimento rápido:</p>

            <form id="form-contato" class="formulario">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" placeholder="(19) 99999-9999">
                </div>

                <div class="campo">
                    <label for="produto">Selecione o Produto:</label>
                    <select id="produto">
                        <option value="">-- Selecione uma opção --</option>
                        <option value="p13">Botijão P13 (Residencial)</option>
                        <option value="p20">Botijão P20 (Empilhadeira)</option>
                        <option value="p45">Cilindro P45 (Comercial)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensagem">Endereço de Entrega ou Mensagem:</label>
                    <textarea id="mensagem" rows="4" placeholder="Rua, Número, Bairro e Observações..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Pedido</button>

                <!-- Mensagem de feedback dinâmico via JS -->
                <div id="mensagem-status" class="mensagem-status oculto"></div>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Ultragaz - Quem faz usa Ultragaz &copy; 2026</p>
    </footer>

</body>

</html>
